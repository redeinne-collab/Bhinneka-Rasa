<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="logoBowl" x1="10" y1="22" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="24" cy="24" r="23" fill="url(#logoBg)"/>

  <!-- Decorative dots (batik style) -->
  <circle cx="24" cy="2.5" r="1.2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="24" cy="45.5" r="1.2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="2.5" cy="24" r="1.2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="45.5" cy="24" r="1.2" fill="#fbbf24" opacity="0.9"/>
  <circle cx="7" cy="7"   r="1"   fill="#fbbf24" opacity="0.6"/>
  <circle cx="41" cy="7"  r="1"   fill="#fbbf24" opacity="0.6"/>
  <circle cx="7" cy="41"  r="1"   fill="#fbbf24" opacity="0.6"/>
  <circle cx="41" cy="41" r="1"   fill="#fbbf24" opacity="0.6"/>

  <!-- Bowl -->
  <path d="M11 25 Q11 38 24 40 Q37 38 37 25 Z" fill="url(#logoBowl)" stroke="#ea580c" stroke-width="1"/>

  <!-- Bowl rim -->
  <rect x="10" y="22" width="28" height="4" rx="2" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>

  <!-- Soup surface -->
  <ellipse cx="24" cy="26" rx="11" ry="3" fill="#fb923c" opacity="0.35"/>

  <!-- Steam -->
  <path d="M18 21 Q16.5 17 18 13" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M24 20 Q22.5 15 24 10" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M30 21 Q31.5 17 30 13" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Chopstick accent -->
  <line x1="33" y1="12" x2="28.5" y2="29" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="33.5" cy="11.5" r="1.6" fill="#fbbf24"/>
</svg>
